name: Build iOS IPA
on:
  workflow_dispatch: # Permite ejecutar el build con un botón en la web de GitHub
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - '.github/workflows/build_ios.yml'
jobs:
  build-ios:
    name: Build iOS App (.ipa)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install Dependencies
        run: flutter pub get
      - name: Build iOS Application
        run: flutter build ios --release --no-codesign
      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r MarthApp.ipa Payload
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarthApp-iOS
          path: MarthApp.ipa
          retention-days: 7
